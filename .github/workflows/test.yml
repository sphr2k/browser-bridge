name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile bin/browser-bridge

  mise:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: mise exec -- browser-bridge --version
      - run: mise exec -- browser-bridge --help
      - if: runner.os == 'macOS'
        run: mise bootstrap macos launchd-agents apply --dry-run

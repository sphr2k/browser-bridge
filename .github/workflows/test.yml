name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile bin/browser-bridge
      - run: ruby -c Formula/browser-bridge.rb

  homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew tap sphr2k/browser-bridge https://github.com/sphr2k/browser-bridge
      - run: brew install sphr2k/browser-bridge/browser-bridge
      - run: brew test sphr2k/browser-bridge/browser-bridge
      - run: brew services info sphr2k/browser-bridge/browser-bridge
